- insert:
    - id: browser-use
      name: 'browser-use'

    - id: browser-use-chrome
      name: 'browser-use-chrome'
      disabled: true
      config:
        toolCallTimeoutMs: 120000

    - id: browser-use-domain
      name: 'browser-use-domain'
      config:
        backend: edge
        headless: false
        browserType: edge
        browserPath: ''
        toolCallTimeoutMs: 120000

    - id: browser-use-edge
      name: 'browser-use-edge'

